<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock CrewAI Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        
        .update-time {
            color: #888;
            font-size: 0.9rem;
        }
        
        /* 头部控制区 */
        .header-controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .date-picker {
            padding: 10px 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 0.9rem;
        }
        
        .date-picker::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }
        
        .search-box {
            padding: 10px 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 0.9rem;
            width: 200px;
        }
        
        .search-box::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        .refresh-btn {
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            color: #fff;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.2s;
        }
        
        .refresh-btn:hover:not(:disabled) {
            transform: scale(1.05);
        }
        
        .refresh-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .card-title {
            font-size: 1rem;
            color: #888;
            margin-bottom: 10px;
        }
        
        .card-value {
            font-size: 2rem;
            font-weight: bold;
        }
        
        .card-value.positive {
            color: #00d4aa;
        }
        
        .card-value.negative {
            color: #ff4757;
        }
        
        .card-change {
            font-size: 0.9rem;
            margin-top: 5px;
        }
        
        .chart-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            height: 350px;
            position: relative;
        }
        
        .chart-container canvas {
            width: 100% !important;
            height: 100% !important;
        }
        
        .chart-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
        }
        
        .positions-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        .positions-table th,
        .positions-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .positions-table th {
            color: #888;
            font-weight: normal;
            font-size: 0.9rem;
        }
        
        .positions-table tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        
        .stock-name {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .stock-code {
            color: #888;
            font-size: 0.85rem;
        }
        
        .pnl-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
        }
        
        .pnl-badge.positive {
            background: rgba(0, 212, 170, 0.2);
            color: #00d4aa;
        }
        
        .pnl-badge.negative {
            background: rgba(255, 71, 87, 0.2);
            color: #ff4757;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            color: #888;
        }
        
        /* 骨架屏动画 */
        .skeleton {
            background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
            border-radius: 8px;
            margin-bottom: 15px;
            padding: 20px;
        }
        
        .skeleton-title {
            height: 20px;
            width: 60%;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            margin-bottom: 10px;
        }
        
        .skeleton-value {
            height: 30px;
            width: 80%;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
        }
        
        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        
        .error {
            text-align: center;
            padding: 50px;
            color: #ff4757;
        }
        
        .alert {
            background: rgba(255, 71, 87, 0.1);
            border: 1px solid rgba(255, 71, 87, 0.3);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            display: none;
        }
        
        .alert.show {
            display: block;
        }
        
        .alert-title {
            color: #ff4757;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        footer {
            text-align: center;
            margin-top: 30px;
            color: #666;
            font-size: 0.85rem;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }
            
            .card-value {
                font-size: 1.5rem;
            }
            
            .grid {
                grid-template-columns: 1fr;
            }
            
            .header-controls {
                flex-direction: column;
                align-items: center;
            }
            
            .date-picker, .search-box {
                width: 100%;
                max-width: 300px;
            }
            
            .chart-container {
                height: 250px;
            }
            
            .positions-table {
                display: block;
                overflow-x: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Stock CrewAI Dashboard</h1>
            <p class="update-time" id="updateTime">加载中...</p>
            <div class="header-controls">
                <input type="date" id="datePicker" class="date-picker" onchange="loadHistoryData()">
                <input type="text" id="searchBox" class="search-box" placeholder="🔍 搜索持仓..." oninput="searchPositions()">
                <button class="refresh-btn" id="refreshBtn" onclick="loadData()">🔄 刷新数据</button>
            </div>
        </header>
        
        <div class="alert" id="alertBox">
            <div class="alert-title">⚠️ 风险提示</div>
            <div id="alertContent"></div>
        </div>
        
        <div class="grid" id="summaryGrid">
            <div class="loading">加载中...</div>
        </div>
        
        <div class="chart-container">
            <h2 class="chart-title">📈 资产走势</h2>
            <canvas id="assetChart"></canvas>
        </div>
        
        <div class="chart-container">
            <h2 class="chart-title">🥧 持仓分布</h2>
            <canvas id="pieChart"></canvas>
        </div>
        
        <div class="card">
            <h2 class="chart-title">📋 持仓明细</h2>
            <table class="positions-table">
                <thead>
                    <tr>
                        <th>股票</th>
                        <th>股数</th>
                        <th>成本</th>
                        <th>现价</th>
                        <th>市值</th>
                        <th>盈亏</th>
                    </tr>
                </thead>
                <tbody id="positionsBody">
                    <tr>
                        <td colspan="6" class="loading">加载中...</td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <footer>
            <p>Powered by Stock CrewAI | 数据仅供参考，不构成投资建议</p>
        </footer>
    </div>
    
    <script>
        let assetChart, pieChart;
        const DATA_URL = '/data/';
        let isLoading = false;
        let currentData = null;
        
        // 显示骨架屏
        function showSkeleton() {
            document.getElementById('summaryGrid').innerHTML = `
                <div class="skeleton">
                    <div class="skeleton-title"></div>
                    <div class="skeleton-value"></div>
                </div>
                <div class="skeleton">
                    <div class="skeleton-title"></div>
                    <div class="skeleton-value"></div>
                </div>
                <div class="skeleton">
                    <div class="skeleton-title"></div>
                    <div class="skeleton-value"></div>
                </div>
                <div class="skeleton">
                    <div class="skeleton-title"></div>
                    <div class="skeleton-value"></div>
                </div>
            `;
            
            document.getElementById('positionsBody').innerHTML = `
                <tr>
                    <td colspan="6" class="loading">
                        <div class="skeleton" style="height: 20px; margin: 10px 0;"></div>
                        <div class="skeleton" style="height: 20px; margin: 10px 0;"></div>
                        <div class="skeleton" style="height: 20px; margin: 10px 0;"></div>
                    </td>
                </tr>
            `;
        }
        
        // 加载历史数据
        async function loadHistoryData() {
            const datePicker = document.getElementById('datePicker');
            const selectedDate = datePicker.value;
            
            if (!selectedDate) {
                loadData();  // 如果没有选择日期，加载最新数据
                return;
            }
            
            if (isLoading) return;
            isLoading = true;
            
            const btn = document.getElementById('refreshBtn');
            btn.disabled = true;
            btn.textContent = '⏳ 加载中...';
            
            showSkeleton();
            
            try {
                const response = await fetch(`${DATA_URL}${selectedDate}-stock-crewai.json`);
                
                if (!response.ok) {
                    throw new Error(`历史数据加载失败: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (!data || typeof data !== 'object') {
                    throw new Error('数据格式错误');
                }
                
                renderDashboard(data);
            } catch (error) {
                console.error('加载历史数据失败:', error);
                document.getElementById('summaryGrid').innerHTML = 
                    `<div class="error">❌ 无法加载 ${selectedDate} 的数据<br>错误: ${error.message}</div>`;
            }
            
            isLoading = false;
            btn.disabled = false;
            btn.textContent = '🔄 刷新数据';
        }
        
        // 搜索持仓
        function searchPositions() {
            const searchBox = document.getElementById('searchBox');
            const keyword = searchBox.value.toLowerCase().trim();
            
            if (!currentData || !Array.isArray(currentData.positions)) {
                return;
            }
            
            if (!keyword) {
                renderPositions(currentData.positions);
                return;
            }
            
            const filteredPositions = currentData.positions.filter(pos => 
                pos.name.toLowerCase().includes(keyword) || 
                pos.code.toLowerCase().includes(keyword)
            );
            
            renderPositions(filteredPositions);
        }
        
        // 渲染持仓表格
        function renderPositions(positions) {
            const tbody = document.getElementById('positionsBody');
            tbody.innerHTML = '';
            
            if (positions.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="loading">未找到匹配的持仓</td></tr>`;
                return;
            }
            
            positions.forEach(pos => {
                const pnl = pos.pnl_pct || 0;
                const pnlClass = pnl >= 0 ? 'positive' : 'negative';
                const pnlEmoji = pnl >= 0 ? '📈' : '📉';
                const marketValue = pos.shares * pos.current;
                
                tbody.innerHTML += `
                    <tr>
                        <td>
                            <div class="stock-name">
                                <span>${pos.name}</span>
                                <span class="stock-code">${pos.code}</span>
                            </div>
                        </td>
                        <td>${pos.shares}</td>
                        <td>¥${pos.avg_cost.toFixed(2)}</td>
                        <td>¥${pos.current.toFixed(2)}</td>
                        <td>¥${formatNumber(marketValue)}</td>
                        <td><span class="pnl-badge ${pnlClass}">${pnlEmoji} ${pnl > 0 ? '+' : ''}${pnl.toFixed(2)}%</span></td>
                    </tr>
                `;
            });
        }
        
        async function loadData() {
            if (isLoading) return;
            
            isLoading = true;
            
            const btn = document.getElementById('refreshBtn');
            btn.disabled = true;
            btn.textContent = '⏳ 加载中...';
            
            showSkeleton();
            
            try {
                const today = new Date().toISOString().split('T')[0];
                const response = await fetch(`${DATA_URL}${today}-stock-crewai.json`);
                
                if (!response.ok) {
                    throw new Error(`数据加载失败: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (!data || typeof data !== 'object') {
                    throw new Error('数据格式错误');
                }
                
                renderDashboard(data);
            } catch (error) {
                console.error('加载数据失败:', error);
                
                try {
                    const sampleResponse = await fetch('sample-data.json');
                    
                    if (!sampleResponse.ok) {
                        throw new Error('示例数据加载失败');
                    }
                    
                    const sampleData = await sampleResponse.json();
                    
                    if (!sampleData || typeof sampleData !== 'object') {
                        throw new Error('示例数据格式错误');
                    }
                    
                    console.log('使用示例数据');
                    renderDashboard(sampleData);
                } catch (e) {
                    console.error('所有数据源均失败:', e);
                    document.getElementById('summaryGrid').innerHTML = 
                        `<div class="error">❌ 无法加载数据<br>错误: ${error.message}<br>请检查 data/ 目录是否存在数据文件</div>`;
                    document.getElementById('positionsBody').innerHTML = 
                        `<tr><td colspan="6" class="error">无数据</td></tr>`;
                }
            }
            
            isLoading = false;
            btn.disabled = false;
            btn.textContent = '🔄 刷新数据';
        }
        
        function renderDashboard(data) {
            if (!data || typeof data !== 'object') {
                console.error('renderDashboard: data is undefined or not an object');
                return;
            }
            
            currentData = data;  // 保存当前数据，供搜索功能使用
            
            document.getElementById('updateTime').textContent = 
                `最后更新: ${data.updateTime || data.date || '未知'}`;
            
            const pnlPct = data.total_pnl_pct || 0;
            const pnlClass = pnlPct >= 0 ? 'positive' : 'negative';
            const pnlEmoji = pnlPct >= 0 ? '📈' : '📉';
            
            document.getElementById('summaryGrid').innerHTML = `
                <div class="card">
                    <div class="card-title">总资产</div>
                    <div class="card-value">¥${formatNumber(data.total_asset)}</div>
                </div>
                <div class="card">
                    <div class="card-title">总收益</div>
                    <div class="card-value ${pnlClass}">${pnlEmoji} ${pnlPct > 0 ? '+' : ''}${pnlPct.toFixed(2)}%</div>
                </div>
                <div class="card">
                    <div class="card-title">现金</div>
                    <div class="card-value">¥${formatNumber(data.cash)}</div>
                </div>
                <div class="card">
                    <div class="card-title">持仓数</div>
                    <div class="card-value">${data.positions?.length || 0} 只</div>
                </div>
            `;
            
            renderPositions(data.positions || []);
            
            renderCharts(data);
            
            checkAlerts(data);
        }
        
        function renderCharts(data) {
            if (!data || typeof data !== 'object') {
                console.error('renderCharts: data is invalid');
                return;
            }
            
            const assetCtx = document.getElementById('assetChart').getContext('2d');
            
            if (assetChart) assetChart.destroy();
            
            const days = 30;
            const labels = [];
            const assetHistory = [];
            const baseAsset = data.total_asset || 100000;
            
            for (let i = days; i >= 0; i--) {
                const date = new Date();
                date.setDate(date.getDate() - i);
                labels.push(date.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' }));
                
                const variation = (Math.random() - 0.48) * 0.02;
                const asset = baseAsset * (1 + variation * (days - i) / days);
                assetHistory.push(asset);
            }
            
            assetChart = new Chart(assetCtx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '总资产',
                        data: assetHistory,
                        borderColor: '#00d4ff',
                        backgroundColor: 'rgba(0, 212, 255, 0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            grid: { color: 'rgba(255, 255, 255, 0.1)' },
                            ticks: { color: '#888', font: { size: 11 } },
                            beginAtZero: false
                        },
                        x: {
                            grid: { color: 'rgba(255, 255, 255, 0.1)' },
                            ticks: { color: '#888', font: { size: 10 }, maxRotation: 45 }
                        }
                    },
                    elements: {
                        line: { borderWidth: 2 },
                        point: { radius: 2, hoverRadius: 5 }
                    }
                }
            });
            
            const pieCtx = document.getElementById('pieChart').getContext('2d');
            
            if (pieChart) pieChart.destroy();
            
            const positions = Array.isArray(data.positions) ? data.positions : [];
            const positionNames = positions.length > 0 ? positions.map(p => p.name || '未知') : [];
            const positionValues = positions.length > 0 ? positions.map(p => (p.shares || 0) * (p.current || 0)) : [];
            
            const colors = [
                '#00d4ff', '#7c3aed', '#00d4aa', '#ff4757', '#ffa502',
                '#2ed573', '#1e90ff', '#ff6b81', '#eccc68', '#a29bfe'
            ];
            
            pieChart = new Chart(pieCtx, {
                type: 'doughnut',
                data: {
                    labels: positionNames,
                    datasets: [{
                        data: positionValues,
                        backgroundColor: colors.slice(0, positionNames.length),
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: { 
                                color: '#fff',
                                font: { size: 12 },
                                padding: 15
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(0, 0, 0, 0.8)',
                            titleColor: '#fff',
                            bodyColor: '#fff'
                        }
                    }
                }
            });
        }
        
        function checkAlerts(data) {
            const alerts = [];
            const pnlPct = data.total_pnl_pct || 0;
            
            if (pnlPct < -5.0) {
                alerts.push(`总收益低于阈值: ${pnlPct.toFixed(2)}% < -5%`);
            }
            
            data.positions?.forEach(pos => {
                if (pos.pnl_pct < -10.0) {
                    alerts.push(`${pos.name} 亏损超过阈值: ${pos.pnl_pct.toFixed(2)}%`);
                }
            });
            
            // 检查持仓集中度
            if (data.positions && data.positions.length > 0) {
                const totalValue = data.total_asset || 1;
                data.positions.forEach(pos => {
                    const posValue = (pos.shares || 0) * (pos.current || 0);
                    const concentration = (posValue / totalValue) * 100;
                    if (concentration > 50) {
                        alerts.push(`${pos.name} 持仓集中度过高: ${concentration.toFixed(2)}% > 50%`);
                    }
                });
            }
            
            if (alerts.length > 0) {
                document.getElementById('alertContent').innerHTML = alerts.map(a => `<div>• ${a}</div>`).join('');
                document.getElementById('alertBox').classList.add('show');
            } else {
                document.getElementById('alertBox').classList.remove('show');
            }
        }
        
        function formatNumber(num) {
            return new Intl.NumberFormat('zh-CN', { maximumFractionDigits: 2 }).format(num);
        }
        
        loadData();
        
        setInterval(loadData, 5 * 60 * 1000);
    </script>
</body>
</html>
