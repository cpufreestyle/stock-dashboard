<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock CrewAI Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Stock CrewAI Dashboard</h1>
            <p class="update-time" id="updateTime">加载中...</p>
            <div class="header-controls">
                <input type="date" id="datePicker" class="date-picker">
                <input type="text" id="searchBox" class="search-box" placeholder="🔍 搜索持仓...">
                <button class="refresh-btn" id="refreshBtn" title="单击: 刷新数据 | 双击: 获取实时行情">🔄 刷新数据</button>
            </div>
        </header>

        <div class="alert" id="alertBox">
            <div class="alert-title">⚠️ 风险提示</div>
            <div id="alertContent"></div>
        </div>

        <div class="grid" id="summaryGrid">
            <div class="loading">加载中...</div>
        </div>

        <div class="chart-container">
            <h2 class="chart-title">📈 资产走势</h2>
            <canvas id="assetChart"></canvas>
        </div>

        <div class="chart-container">
            <h2 class="chart-title">🥧 持仓分布</h2>
            <canvas id="pieChart"></canvas>
        </div>

        <div class="card">
            <h2 class="chart-title">📋 持仓明细</h2>
            <table class="positions-table">
                <thead>
                    <tr>
                        <th>股票</th>
                        <th>股数</th>
                        <th>成本</th>
                        <th>现价</th>
                        <th>市值</th>
                        <th>盈亏</th>
                    </tr>
                </thead>
                <tbody id="positionsBody">
                    <tr><td colspan="6" class="loading">加载中...</td></tr>
                </tbody>
            </table>
        </div>

        <footer>
            <p>Powered by Stock CrewAI | 数据仅供参考，不构成投资建议 | 双击刷新按钮获取实时行情</p>
        </footer>
    </div>

    <script src="js/api.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
